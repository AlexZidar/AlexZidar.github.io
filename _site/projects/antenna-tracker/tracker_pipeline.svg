<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" style="background: #14161a; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209b7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3f37c9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00b4d8" flood-opacity="0.3"/>
    </filter>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    
    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#00b4d8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#a855f7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="600" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">Antenna Tracker Autonomous Localization &amp; Targeting Pipeline</text>
  <text x="600" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Multi-Sensor Fusion, WMM Declination Lookup, CoCom Mitigation &amp; WGS-84 Ellipsoidal Kinematics</text>

  <!-- ==================== TRACK 1: ROCKET AVIONICS (TOP) ==================== -->
  <rect x="30" y="80" width="1140" height="150" rx="10" fill="url(#rocketGrad)" stroke="#00b4d8" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="42" y="69" width="135" height="22" rx="4" fill="#00b4d8"/>
  <text x="109" y="84" text-anchor="middle" fill="#0f172a" font-size="10.5" font-weight="700" letter-spacing="0.5">Airborne Avionics</text>

  <!-- Rocket Step 1: Boot & Cold Lock -->
  <rect x="55" y="105" width="140" height="95" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="125" y="125" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">GNSS Receiver</text>
  <text x="125" y="145" text-anchor="middle" fill="#94a3b8" font-size="10">u-blox SAM-M10Q</text>
  <text x="125" y="163" text-anchor="middle" fill="#38bdf8" font-size="9.5">Cold Lock &amp; Multi-GNSS</text>
  <text x="125" y="180" text-anchor="middle" fill="#64748b" font-size="9">(GPS / Galileo / BeiDou)</text>

  <!-- Arrow -->
  <line x1="195" y1="152" x2="235" y2="152" stroke="#00b4d8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>

  <!-- Rocket Step 2: CoCom & High-G Monitor -->
  <rect x="240" y="105" width="175" height="95" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="327" y="125" text-anchor="middle" fill="#fbbf24" font-size="11.5" font-weight="600">Dynamic State Monitor</text>
  <text x="327" y="144" text-anchor="middle" fill="#e2e8f0" font-size="10">CoCom Limits Check</text>
  <text x="327" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">&gt;1000 kts / High-G Boost</text>
  <text x="327" y="181" text-anchor="middle" fill="#f59e0b" font-size="9">Fix Validity Verification</text>

  <!-- Branch: Normal GNSS vs Dead Reckoning -->
  <line x1="415" y1="135" x2="455" y2="125" stroke="#00b4d8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <line x1="415" y1="170" x2="455" y2="175" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrowGold)"/>

  <!-- Rocket Step 3: Dual State Fusion -->
  <rect x="460" y="98" width="185" height="50" rx="6" fill="#1e293b" stroke="#00b4d8" stroke-width="1"/>
  <text x="552" y="118" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="600">Nominal: UBX-NAV-PVT</text>
  <text x="552" y="136" text-anchor="middle" fill="#94a3b8" font-size="9.5">Raw Lat, Lon, Ellipsoid Height</text>

  <rect x="460" y="156" width="185" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="552" y="174" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="600">Lockout: IMU + Baro Fusion</text>
  <text x="552" y="193" text-anchor="middle" fill="#94a3b8" font-size="9.5">Dead-Reckoning + BMP581 Alt</text>

  <!-- Combine to Telemetry Frame -->
  <line x1="645" y1="123" x2="685" y2="145" stroke="#00b4d8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <line x1="645" y1="182" x2="685" y2="160" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrowGold)"/>

  <!-- Rocket Step 4: Binary Framing -->
  <rect x="690" y="112" width="170" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="136" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-weight="600">Telemetry Assembler</text>
  <text x="775" y="156" text-anchor="middle" fill="#94a3b8" font-size="10">Packed Struct (CRC-16)</text>
  <text x="775" y="174" text-anchor="middle" fill="#38bdf8" font-size="9.5">Position, Velocity &amp; Pressure</text>

  <!-- Arrow -->
  <line x1="860" y1="152" x2="905" y2="152" stroke="#00b4d8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>

  <!-- Rocket Step 5: LoRa Downlink -->
  <rect x="910" y="105" width="235" height="95" rx="6" fill="#1e293b" stroke="#00b4d8" stroke-width="1.4" filter="url(#cyanGlow)"/>
  <text x="1027" y="128" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">915 MHz Long-Range LoRa</text>
  <text x="1027" y="148" text-anchor="middle" fill="#e2e8f0" font-size="10">Semtech SX1262 (2W / 33 dBm)</text>
  <text x="1027" y="166" text-anchor="middle" fill="#94a3b8" font-size="9.5">Binary Airframe Telemetry Stream</text>
  <text x="1027" y="184" text-anchor="middle" fill="#00b4d8" font-size="9">Dynamic Spreading Factor (SF7-SF10)</text>

  <!-- RF Link downward line -->
  <path d="M 1027 200 L 1027 265" fill="none" stroke="#00b4d8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowCyan)"/>
  <text x="1035" y="238" fill="#38bdf8" font-size="9" font-style="italic">Wireless RF Telemetry Link</text>


  <!-- ==================== TRACK 2: GROUND STATION LOCALIZATION (MIDDLE) ==================== -->
  <rect x="30" y="250" width="840" height="170" rx="10" fill="url(#gsGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="42" y="239" width="180" height="22" rx="4" fill="#7209b7"/>
  <text x="132" y="254" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="700" letter-spacing="0.5">Base Station Localization</text>

  <!-- GS Local Sensors -->
  <!-- Magnetometer Branch -->
  <rect x="55" y="272" width="160" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="135" y="292" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">MMC5983MA Compass</text>
  <text x="135" y="309" text-anchor="middle" fill="#94a3b8" font-size="9.5">Raw 3-Axis Field (Bx, By)</text>
  <text x="135" y="325" text-anchor="middle" fill="#c084fc" font-size="9">Hard / Soft-Iron Calibration</text>

  <!-- Local GNSS Branch -->
  <rect x="55" y="347" width="160" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="135" y="367" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Base u-blox GNSS</text>
  <text x="135" y="384" text-anchor="middle" fill="#94a3b8" font-size="9.5">Local Fix (Lat_GS, Lon_GS)</text>
  <text x="135" y="399" text-anchor="middle" fill="#a855f7" font-size="9">BMP581 Baro Reference</text>

  <!-- Arrows into Almanac & Heading -->
  <line x1="215" y1="304" x2="255" y2="304" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <line x1="215" y1="377" x2="255" y2="377" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- Compass Heading calculation -->
  <rect x="260" y="272" width="165" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="342" y="293" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Magnetic Heading</text>
  <text x="342" y="311" text-anchor="middle" fill="#c084fc" font-size="10">Ψ_mag = atan2(By, Bx)</text>
  <text x="342" y="326" text-anchor="middle" fill="#94a3b8" font-size="9">Gimbal Chassis Orientation</text>

  <!-- WMM Declination Lookup -->
  <rect x="260" y="347" width="165" height="60" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="342" y="367" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">WMM Declination LUT</text>
  <text x="342" y="385" text-anchor="middle" fill="#e2e8f0" font-size="9.5">World Magnetic Model 2D LUT</text>
  <text x="342" y="399" text-anchor="middle" fill="#94a3b8" font-size="9">Local Magnetic Offset (δ)</text>

  <!-- Arrow into True North Resolver -->
  <line x1="425" y1="304" x2="465" y2="325" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <line x1="425" y1="377" x2="465" y2="355" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- True North Resolver -->
  <rect x="470" y="295" width="185" height="85" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.4" filter="url(#purpleGlow)"/>
  <text x="562" y="318" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">True North Resolver</text>
  <text x="562" y="337" text-anchor="middle" fill="#f8fafc" font-size="10.5">Ψ_true = Ψ_mag + δ</text>
  <text x="562" y="355" text-anchor="middle" fill="#94a3b8" font-size="9">Calibrated Geodetic North Datum</text>
  <text x="562" y="370" text-anchor="middle" fill="#38bdf8" font-size="8.5">&lt;0.5° Absolute Bearing Accuracy</text>

  <!-- Mode Selector: Static vs Dynamic -->
  <line x1="655" y1="337" x2="695" y2="337" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <rect x="700" y="272" width="155" height="135" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="777" y="292" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Operating Modes</text>
  
  <rect x="710" y="304" width="135" height="42" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="777" y="321" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="600">Static Mode (Pad)</text>
  <text x="777" y="337" text-anchor="middle" fill="#94a3b8" font-size="8.5">1 Hz Multi-Sample Averaging</text>

  <rect x="710" y="354" width="135" height="42" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="777" y="371" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="600">Dynamic Mode (Mobile)</text>
  <text x="777" y="387" text-anchor="middle" fill="#94a3b8" font-size="8.5">Real-Time Chase Recalibration</text>


  <!-- LoRa Receiver Module on Ground Station (Right) -->
  <rect x="910" y="270" width="235" height="130" rx="8" fill="#1e293b" stroke="#00b4d8" stroke-width="1.2"/>
  <text x="1027" y="296" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Ground LoRa Receiver</text>
  <text x="1027" y="316" text-anchor="middle" fill="#e2e8f0" font-size="10">Duplicate Rasalhague Board</text>
  <text x="1027" y="336" text-anchor="middle" fill="#94a3b8" font-size="9.5">SX1262 Demodulation @ 915 MHz</text>
  <text x="1027" y="356" text-anchor="middle" fill="#94a3b8" font-size="9.5">UBX Parser &amp; CRC Validation</text>
  <text x="1027" y="378" text-anchor="middle" fill="#34d399" font-size="9">Outputs: Lat_R, Lon_R, Alt_R</text>


  <!-- ==================== TRACK 3: TARGETING & MOTION CONTROLLER (BOTTOM) ==================== -->
  <rect x="30" y="445" width="1140" height="195" rx="10" fill="url(#targetGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="42" y="434" width="280" height="22" rx="4" fill="#059669"/>
  <text x="182" y="449" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="700" letter-spacing="0.5">WGS-84 Ellipsoidal Kinematics &amp; Control</text>

  <!-- Arrows into Kinematics Block -->
  <!-- From Ground Base Resolver -->
  <path d="M 777 410 L 777 485 L 195 485 L 195 500" fill="none" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <!-- From Rocket LoRa -->
  <path d="M 1027 400 L 1027 470 L 100 470 L 100 500" fill="none" stroke="#00b4d8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>

  <!-- Step 1: WGS-84 Oblate Spheroid ECEF Conversion -->
  <rect x="55" y="505" width="275" height="115" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="192" y="528" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">1. WGS-84 Oblate Spheroid Model</text>
  <text x="192" y="548" text-anchor="middle" fill="#e2e8f0" font-size="10">Curved / Oblong Earth Geodesy</text>
  <text x="192" y="567" text-anchor="middle" fill="#94a3b8" font-size="9.5">a = 6,378,137.0 m | f = 1/298.257</text>
  <text x="192" y="586" text-anchor="middle" fill="#94a3b8" font-size="9.5">(Lat, Lon, Alt) → ECEF (X, Y, Z)</text>
  <text x="192" y="605" text-anchor="middle" fill="#38bdf8" font-size="9">Eliminates Flat-Earth &amp; Spherical Bias</text>

  <!-- Arrow -->
  <line x1="330" y1="562" x2="365" y2="562" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Step 2: Local ENU Transformation -->
  <rect x="370" y="505" width="235" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="487" y="528" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">2. Local Tangent Plane</text>
  <text x="487" y="548" text-anchor="middle" fill="#34d399" font-size="10.5">ECEF → Topocentric ENU</text>
  <text x="487" y="567" text-anchor="middle" fill="#94a3b8" font-size="9.5">Δr_ENU = R_ECEF→ENU · (r_R - r_GS)</text>
  <text x="487" y="586" text-anchor="middle" fill="#94a3b8" font-size="9.5">Resolves: [East, North, Up] Basis</text>
  <text x="487" y="605" text-anchor="middle" fill="#a855f7" font-size="9">Relative to Ground Station Location</text>

  <!-- Arrow -->
  <line x1="605" y1="562" x2="640" y2="562" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Step 3: Look Angle Vector Resolver -->
  <rect x="645" y="505" width="240" height="115" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.4" filter="url(#greenGlow)"/>
  <text x="765" y="528" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">3. Look Angle Resolver</text>
  <text x="765" y="548" text-anchor="middle" fill="#f8fafc" font-size="10">Azimuth: α = atan2(ΔE, ΔN) - Ψ_true</text>
  <text x="765" y="567" text-anchor="middle" fill="#f8fafc" font-size="10">Elevation: θ = atan2(ΔU, √(ΔE² + ΔN²))</text>
  <text x="765" y="587" text-anchor="middle" fill="#94a3b8" font-size="9.5">Localizes End-Effector to Rocket Line-of-Sight</text>
  <text x="765" y="605" text-anchor="middle" fill="#38bdf8" font-size="9">Elevation Clamped: 0° to 90° (No Zenith Lock)</text>

  <!-- Arrow -->
  <line x1="885" y1="562" x2="920" y2="562" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Step 4: Closed-Loop Hardware Actuation -->
  <rect x="925" y="495" width="225" height="130" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.4"/>
  <text x="1037" y="520" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">Closed-Loop Actuation</text>
  <text x="1037" y="539" text-anchor="middle" fill="#e2e8f0" font-size="10">2x MKS SERVO42C Drivers</text>
  <text x="1037" y="557" text-anchor="middle" fill="#94a3b8" font-size="9">High-Speed UART (115200 baud)</text>
  <text x="1037" y="574" text-anchor="middle" fill="#38bdf8" font-size="9">Pan Axis (0xE0) | Tilt Axis (0xE1)</text>
  <text x="1037" y="592" text-anchor="middle" fill="#fbbf24" font-size="9">20 kHz Magnetic Encoders</text>
  <text x="1037" y="609" text-anchor="middle" fill="#94a3b8" font-size="8.5">Zero Step Loss under High Wind / G-Loads</text>

</svg>